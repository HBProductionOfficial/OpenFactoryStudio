name: Build and test
description: Installs Qt, configures with a CMake preset, builds and runs the tests.

inputs:
  preset:
    description: CMake configure/build/test preset
    required: true
  qt-arch:
    description: aqtinstall architecture (e.g. win64_msvc2022_64, linux_gcc_64)
    required: true
  qt-tools:
    description: aqtinstall tools to install
    required: false
    default: ''
  qt-version:
    description: Qt version
    required: false
    default: '6.8.3'

runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~3.31.0'

    - name: Install system packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libgl1-mesa-dev libglu1-mesa-dev libegl1 libxkbcommon-dev \
          libfontconfig1 libfreetype6 libxcb-cursor0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        arch: ${{ inputs.qt-arch }}
        modules: qt5compat qtimageformats
        tools: ${{ inputs.qt-tools }}
        cache: true
        aqtversion: '==3.3.*'

    - name: Set up MSVC environment
      if: runner.os == 'Windows' && startsWith(inputs.preset, 'win-msvc')
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure
      shell: bash
      run: |
        # CMake reads backslashes in paths as escapes, so use forward slashes.
        export OFS_QT_DIR="$(printf '%s' "$QT_ROOT_DIR" | tr '\\' '/')"
        if [ -n "$IQTA_TOOLS" ]; then export OFS_LLVM_MINGW="$(printf '%s' "$IQTA_TOOLS" | tr '\\' '/')/llvm-mingw1706_64"; fi
        cmake --preset ${{ inputs.preset }} -DOFS_WERROR=ON

    - name: Build
      shell: bash
      run: cmake --build --preset ${{ inputs.preset }}

    - name: Test
      shell: bash
      run: ctest --preset ${{ inputs.preset }}
