<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  body { margin: 0; background: #1f2328; color: #e6e8eb; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { margin: 0 0 16px; font-size: 28px; font-weight: 600; }
  h2 { margin: 28px 0 10px; font-size: 18px; font-weight: 600; color: #9fb4c8; }
  a { color: #7cb7ff; }
  img { max-width: 100%; border-radius: 4px; }
  .previews { display: flex; gap: 16px; flex-wrap: wrap; }
  table td { padding: 2px 12px 2px 0; vertical-align: top; }
  table td:first-child { color: #9aa4ae; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>!ff displayname!</h1>
  <div class="previews">
    !ff stage!
    !ff stage_anim!
  </div>
  <table>
    <tr><td>!ff titlename!</td><td>!ff charname!</td></tr>
    <tr><td>!ff titledate!</td><td>!ff chardate!</td></tr>
    <tr><td>!ff titleversion!</td><td>!ff mugenversion!</td></tr>
    <tr><td>!ff titleauthor!</td><td>!ff author!</td></tr>
    <tr><td>!ff titleemail!</td><td>!ff email!</td></tr>
    <tr><td>!ff titlehomepage!</td><td>!ff homepage!</td></tr>
  </table>

  <h2>!ff titletext!</h2>
  <p>!ff text!</p>
</main>
</body>
</html>
