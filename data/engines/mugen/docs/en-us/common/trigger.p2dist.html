<h2>P2Dist</h2>
<p>Returns the distance to the opponent measured between both axes. Give the component after the name.</p>
<h3>Format</h3>
<pre>P2Dist X
P2Dist Y</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Notes</h3>
<ul><li>For X, a positive value means it is in front of the player.</li></ul>
<h3>Example</h3>
<pre>trigger1 = P2Dist X &lt; 40</pre>
