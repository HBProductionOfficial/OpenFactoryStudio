<h2>VelAdd</h2>
<p>Adds to the player's velocity (positive x forward, positive y down).</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>x</b></td><td>float expression</td><td>X velocity to add.</td></tr>
<tr><td><b>y</b></td><td>float expression</td><td>Y velocity to add.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 1100, Gravity]
type = VelAdd
trigger1 = 1
y = 0.5</pre>
