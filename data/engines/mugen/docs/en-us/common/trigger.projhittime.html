<h2>ProjHitTime</h2>
<p>Returns the ticks since a projectile of the player hit an opponent; -1 if that never happened.</p>
<h3>Format</h3>
<pre>ProjHitTime(id)</pre>
<h3>Arguments</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>id</b></td><td>Projectile ID to check; 0 means any projectile.</td></tr>
</table>
<h3>Returns</h3>
<p>int</p>
<h3>Example</h3>
<pre>trigger1 = ProjHitTime(1000) = 0</pre>
