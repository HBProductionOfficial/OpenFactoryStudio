<h2>AngleAdd</h2>
<p>Adds to the rotation angle that AngleDraw uses.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>float expression, <b>required</b></td><td>Degrees to add.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 1200, Spin]
type = AngleAdd
trigger1 = 1
value = 15</pre>
