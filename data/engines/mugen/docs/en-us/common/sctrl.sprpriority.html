<h2>SprPriority</h2>
<p>Sets the drawing priority of the player; higher values are drawn in front.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>integer expression, <b>required</b></td><td>Priority from -5 to 5.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 200, Front]
type = SprPriority
trigger1 = Time = 0
value = 2</pre>
