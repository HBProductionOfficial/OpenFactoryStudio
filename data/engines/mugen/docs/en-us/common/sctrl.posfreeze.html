<h2>PosFreeze</h2>
<p>Keeps the position of the player unchanged for the current tick.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>expression, 0 or 1</td><td>Non-zero freezes the position. Default 1.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 1500, Hover]
type = PosFreeze
trigger1 = 1</pre>
