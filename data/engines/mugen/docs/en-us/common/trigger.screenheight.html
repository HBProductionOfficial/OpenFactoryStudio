<h2>ScreenHeight</h2>
<p>Returns the height of the screen in screen-space units, as used by screen-space explods.</p>
<p><i>Available from M.U.G.E.N 1.1.</i></p>
<h3>Format</h3>
<pre>ScreenHeight</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Example</h3>
<pre>pos = ScreenWidth / 2, ScreenHeight / 2</pre>
