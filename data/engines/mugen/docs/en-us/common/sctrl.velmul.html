<h2>VelMul</h2>
<p>Multiplies the player's velocity.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>x</b></td><td>float expression</td><td>X velocity to add.</td></tr>
<tr><td><b>y</b></td><td>float expression</td><td>Y velocity to add.</td></tr>
</table>
<h3>Notes</h3>
<ul><li>Same parameters as VelAdd, used as multipliers.</li></ul>
<h3>Example</h3>
<pre>[State 105, Friction]
type = VelMul
trigger1 = 1
x = 0.85</pre>
