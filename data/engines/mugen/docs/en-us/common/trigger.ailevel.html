<h2>AILevel</h2>
<p>Returns the difficulty of the computer player controlling the character, from 1 to 8, or 0 when a human plays.</p>
<p><i>Available from M.U.G.E.N 1.0.</i></p>
<h3>Format</h3>
<pre>AILevel</pre>
<h3>Returns</h3>
<p>int</p>
<h3>Example</h3>
<pre>trigger1 = AILevel &gt; 0
trigger1 = Random &lt; AILevel * 50</pre>
