<h2>PlayerPush</h2>
<p>Turns off pushing between players for one tick, so they can pass through each other.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>expression, 0 or 1, <b>required</b></td><td>0 disables pushing, non-zero keeps it.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 700, Roll]
type = PlayerPush
trigger1 = 1
value = 0</pre>
