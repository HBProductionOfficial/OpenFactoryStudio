<h2>Pos</h2>
<p>Returns the position of the player: X from the centre of the screen, Y from the floor (negative above it).</p>
<h3>Format</h3>
<pre>Pos X
Pos Y</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Notes</h3>
<ul><li>Pos X + CameraPos X gives the position in the stage.</li></ul>
<h3>Example</h3>
<pre>trigger1 = Pos Y &gt;= 0</pre>
