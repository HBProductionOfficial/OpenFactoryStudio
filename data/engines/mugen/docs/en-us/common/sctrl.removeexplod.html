<h2>RemoveExplod</h2>
<p>Removes explods of the player.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>ID</b></td><td>integer expression</td><td>Only explods with this ID. All explods when omitted.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 0, Cleanup]
type = RemoveExplod
trigger1 = Time = 0
ID = 1050</pre>
