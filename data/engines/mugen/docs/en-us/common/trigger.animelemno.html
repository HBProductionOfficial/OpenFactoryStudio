<h2>AnimElemNo</h2>
<p>Returns the number of the element that will be shown a given number of ticks from now (0 = now).</p>
<h3>Format</h3>
<pre>AnimElemNo(ticks)</pre>
<h3>Returns</h3>
<p>int</p>
<h3>Notes</h3>
<ul><li>Bottom when the time is outside the animation.</li></ul>
<h3>Example</h3>
<pre>trigger1 = AnimElemNo(0) = 4</pre>
