<h2>AngleSet</h2>
<p>Sets the rotation angle that AngleDraw uses. The angle starts at 0.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>float expression, <b>required</b></td><td>Angle in degrees.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 1200, Reset]
type = AngleSet
trigger1 = Time = 0
value = 0</pre>
