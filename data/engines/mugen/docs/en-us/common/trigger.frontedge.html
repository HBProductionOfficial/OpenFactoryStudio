<h2>FrontEdge</h2>
<p>Returns the x or y position of the edge in front of the player of the screen, in stage coordinates.</p>
<p><i>Available from M.U.G.E.N 1.1.</i></p>
<h3>Format</h3>
<pre>FrontEdge</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Example</h3>
<pre>trigger1 = Pos X + CameraPos X &gt; FrontEdge - 20</pre>
