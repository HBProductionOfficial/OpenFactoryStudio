<h2>HitAdd</h2>
<p>Adds hits to the combo counter shown on screen.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>integer expression, <b>required</b></td><td>Number of hits to add.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 3000, Bonus hits]
type = HitAdd
trigger1 = MoveHit = 1
value = 2</pre>
