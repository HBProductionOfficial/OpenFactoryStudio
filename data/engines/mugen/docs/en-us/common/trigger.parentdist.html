<h2>ParentDist</h2>
<p>Returns the distance to the parent of a helper. Give the component after the name.</p>
<h3>Format</h3>
<pre>ParentDist X
ParentDist Y</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Notes</h3>
<ul><li>For X, a positive value means it is in front of the player.</li></ul>
<h3>Example</h3>
<pre>trigger1 = ParentDist X &lt; 40</pre>
