<h2>FallEnvShake</h2>
<p>Shakes the screen with the fall.envshake values of the hit the player received, then clears them so the shake happens once. common1.cns uses it when a falling player hits the ground.</p>
<h3>Example</h3>
<pre>[State 5100, Land shake]
type = FallEnvShake
trigger1 = Time = 0</pre>
