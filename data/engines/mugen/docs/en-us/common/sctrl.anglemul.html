<h2>AngleMul</h2>
<p>Multiplies the rotation angle that AngleDraw uses.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>float expression, <b>required</b></td><td>Factor to multiply the angle by.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 1200, Slow down]
type = AngleMul
trigger1 = 1
value = 0.9</pre>
