<h2>PosAdd</h2>
<p>Moves the player by an offset: positive x is forward, positive y is down.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>x</b></td><td>float expression</td><td>Pixels to move forward.</td></tr>
<tr><td><b>y</b></td><td>float expression</td><td>Pixels to move down.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 200, Step]
type = PosAdd
trigger1 = AnimElem = 2
x = 8</pre>
