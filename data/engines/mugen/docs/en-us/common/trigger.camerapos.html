<h2>CameraPos</h2>
<p>Returns the position of the camera centre in stage coordinates.</p>
<p><i>Available from M.U.G.E.N 1.1.</i></p>
<h3>Format</h3>
<pre>CameraPos X
CameraPos Y</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Notes</h3>
<ul><li>Pos X + CameraPos X gives the absolute stage position of the player.</li></ul>
<h3>Example</h3>
<pre>value = Pos X + CameraPos X</pre>
