<h2>TeamMode</h2>
<p>Compares the team mode of the player.</p>
<h3>Format</h3>
<pre>TeamMode = mode
TeamMode != mode</pre>
<h3>Arguments</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>mode</b></td><td>Single, Simul or Turns.</td></tr>
</table>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Example</h3>
<pre>trigger1 = TeamMode = Simul</pre>
