<h2>Name</h2>
<p>Compares the name of the player (name in the [Info] group) with a string.</p>
<h3>Format</h3>
<pre>Name = "name"
Name != "name"</pre>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Notes</h3>
<ul><li>Only = and != are allowed; the name must be in double quotes.</li></ul>
<h3>Example</h3>
<pre>trigger1 = Name = "Kung Fu Man"</pre>
