<h2>PosSet</h2>
<p>Sets the position of the player: x from the centre of the screen, y from the floor.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>x</b></td><td>float expression</td><td>New x position.</td></tr>
<tr><td><b>y</b></td><td>float expression</td><td>New y position (negative is above the floor).</td></tr>
</table>
<h3>Example</h3>
<pre>[State 191, Ground]
type = PosSet
trigger1 = Time = 0
y = 0</pre>
