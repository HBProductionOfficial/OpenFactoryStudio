<h2>P1Name</h2>
<p>Compares the name of the player with a string.</p>
<h3>Format</h3>
<pre>P1Name = "name"
P1Name != "name"</pre>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Notes</h3>
<ul><li>Only = and != are allowed; the name must be in double quotes.</li></ul>
<h3>Example</h3>
<pre>trigger1 = P1Name = "Kung Fu Man"</pre>
