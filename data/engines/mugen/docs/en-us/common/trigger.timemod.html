<h2>TimeMod</h2>
<p>Old-style trigger: true when the state time divided by a number leaves a given remainder.</p>
<p><i>Deprecated since 1.0.</i></p>
<h3>Format</h3>
<pre>TimeMod = divisor, remainder</pre>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Notes</h3>
<ul><li>Deprecated: write Time % divisor = remainder instead.</li></ul>
<h3>Example</h3>
<pre>trigger1 = TimeMod = 4, 0</pre>
