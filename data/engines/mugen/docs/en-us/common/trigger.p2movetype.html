<h2>P2MoveType</h2>
<p>Compares the move type of the opponent.</p>
<h3>Format</h3>
<pre>P2MoveType = type</pre>
<h3>Arguments</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>type</b></td><td>A, I or H.</td></tr>
</table>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Example</h3>
<pre>trigger1 = P2MoveType = A</pre>
