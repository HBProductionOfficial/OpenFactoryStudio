<h2>AnimElemTime</h2>
<p>Returns the ticks elapsed since an element of the current animation started (negative if it has not started yet).</p>
<h3>Format</h3>
<pre>AnimElemTime(n)</pre>
<h3>Returns</h3>
<p>int</p>
<h3>Notes</h3>
<ul><li>Bottom for an element that does not exist.</li></ul>
<h3>Example</h3>
<pre>trigger1 = AnimElemTime(3) = 0</pre>
