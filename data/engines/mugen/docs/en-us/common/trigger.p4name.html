<h2>P4Name</h2>
<p>Compares the name of the second opponent with a string.</p>
<h3>Format</h3>
<pre>P4Name = "name"
P4Name != "name"</pre>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Notes</h3>
<ul><li>Only = and != are allowed; the name must be in double quotes.</li></ul>
<h3>Example</h3>
<pre>trigger1 = P4Name = "Kung Fu Man"</pre>
