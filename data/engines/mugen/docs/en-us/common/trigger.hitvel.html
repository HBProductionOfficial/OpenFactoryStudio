<h2>HitVel</h2>
<p>Returns the velocity the player received from the hit it is reacting to.</p>
<h3>Format</h3>
<pre>HitVel X
HitVel Y</pre>
<h3>Returns</h3>
<p>float</p>
<h3>Notes</h3>
<ul><li>Positive x pushes the player backwards.</li></ul>
<h3>Example</h3>
<pre>trigger1 = HitVel Y &lt; -5</pre>
