<h2>TargetState</h2>
<p>Sends the targets to one of the player states (a custom state).</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>value</b></td><td>integer expression, <b>required</b></td><td>State number.</td></tr>
<tr><td><b>ID</b></td><td>integer expression</td><td>Only targets with this id; -1 for all.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 810, Throw]
type = TargetState
trigger1 = AnimTime = 0
value = 821</pre>
