<h2>P2StateType</h2>
<p>Compares the state type of the opponent.</p>
<h3>Format</h3>
<pre>P2StateType = type</pre>
<h3>Arguments</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>type</b></td><td>S, C, A or L.</td></tr>
</table>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Example</h3>
<pre>trigger1 = P2StateType = A</pre>
