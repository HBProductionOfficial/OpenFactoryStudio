<h2>Offset</h2>
<p>Shifts where the player is drawn, without moving its position.</p>
<h3>Parameters</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>x</b></td><td>float expression</td><td>Horizontal drawing offset.</td></tr>
<tr><td><b>y</b></td><td>float expression</td><td>Vertical drawing offset.</td></tr>
</table>
<h3>Example</h3>
<pre>[State 0, Shake]
type = Offset
trigger1 = Time % 2 = 0
x = 2</pre>
