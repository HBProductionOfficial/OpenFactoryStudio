<h2>StateType</h2>
<p>Compares the state type of the player.</p>
<h3>Format</h3>
<pre>StateType = type
StateType != type</pre>
<h3>Arguments</h3>
<table cellspacing="0" cellpadding="3">
<tr><td><b>type</b></td><td>S standing, C crouching, A air, L lying.</td></tr>
</table>
<h3>Returns</h3>
<p>boolean (1 or 0)</p>
<h3>Example</h3>
<pre>trigger1 = StateType != A</pre>
